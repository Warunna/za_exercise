<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>

  <body>
    <header class="header">
      <img src= src\Pokemon\Logo.png width="200" height="150" alt="ภาพ">
    </header>

    <div class="pokemon-filter-box">
      <div class="type-filter">
        <select>
          <option value="0">Select type:</option>
          <option value="1">fire</option>
          <option value="2">water</option>
        </select>
      </div>
      
      <div class="captured-filter">
        <select>
          <option value="0">Select captured status:</option>
          <option value="1">Any</option>
          <option value="2">Captured</option>
          <option value="3">Not Captured</option>
        </select>
      </div>
    </div>

    <main class="main-content">
      <div class="pokemon-box">
          <div class="pokemon-card">
            <img src= src\Pokemon\Tangrowth.png width="150" height="130" alt="ภาพ">
            <p>Tangrowth</p>
          </div>

            <img src= src\Pokemon\Meowscarada.png width="150" height="130" alt="ภาพ">
            <p>Meowscarada</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\Pichu.png width="130" height="130" alt="ภาพ">
            <p>Pichu</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\EeveeFairy.png width="150" height="130" alt="ภาพ">
            <p>Eevee Fairy</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\Ninetales.png width="150" height="130" alt="ภาพ">
            <p>Ninetales</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\Marill.png width="150" height="130" alt="ภาพ">
            <p>Marill</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\Arceus.png width="150" height="130" alt="ภาพ">
            <p>Arceus</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\Ekans.png width="150" height="130" alt="ภาพ">
            <p>Ekans</p>
          </div>
          <div class="pokemon-card">
            <img src= src\Pokemon\Rayquaza.png width="150" height="130" alt="ภาพ">

          </div>          
          <div class="pokemon-card">
            <img src= src\Pokemon\Mimikyu.png width="150" height="130" alt="ภาพ">
            <p>Mimikyu</p>
          </div>
      </div>

    </main>

</html>
